name: Upstream Sync

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: upstream-sync
  cancel-in-progress: false

permissions: {}

env:
  UPSTREAM_REPO: HKUDS/nanobot
  TARGET_BRANCH: main

jobs:
  check:
    name: Detect the newest upstream release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      needed: ${{ steps.release.outputs.needed }}
      tag: ${{ steps.release.outputs.tag }}
      kind: ${{ steps.release.outputs.kind }}
      branch: ${{ steps.release.outputs.branch }}
      base_sha: ${{ steps.release.outputs.base_sha }}
      release_sha: ${{ steps.release.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}

      - name: Find the newest published upstream release
        id: release
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
        run: |
          release=$(gh api "repos/$UPSTREAM_REPO/releases?per_page=100" \
            --jq 'map(select(.draft == false)) | sort_by(.published_at) | last // empty | [.tag_name, (.prerelease | tostring)] | @tsv')
          if [[ -z "$release" ]]; then
            echo "No published upstream release found."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          IFS=$'\t' read -r tag pre <<< "$release"
          if ! git check-ref-format "refs/tags/$tag"; then
            echo "::error::Upstream release has an invalid tag name."
            exit 1
          fi

          git remote add upstream "https://github.com/$UPSTREAM_REPO.git"
          git fetch --no-tags upstream "refs/tags/$tag:refs/upstream-tags/$tag"
          git fetch --no-tags origin "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          release_sha=$(git rev-parse "refs/upstream-tags/$tag^{commit}")
          base_sha=$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH")

          # A tag with the same name on the fork must point to the upstream commit.
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/$tag:refs/origin-tags/$tag"
            if [[ "$(git rev-parse "refs/origin-tags/$tag^{commit}")" != "$release_sha" ]]; then
              echo "::error::Fork tag $tag exists but points to a different commit than upstream."
              exit 1
            fi
          fi

          if [[ "$pre" = "true" ]]; then
            kind=prerelease
            branch="prerelease-check/$tag"
          else
            kind=stable
            branch="sync/upstream-$tag"
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/upstream-synced/$tag" >/dev/null 2>&1; then
            echo "$tag already handled."
            needed=false
          elif [[ "$kind" = stable ]] && git merge-base --is-ancestor "$release_sha" "$base_sha"; then
            echo "$tag is already in $TARGET_BRANCH."
            needed=false
          else
            echo "Found upstream $kind $tag."
            needed=true
          fi

          {
            echo "needed=$needed"
            echo "tag=$tag"
            echo "kind=$kind"
            echo "branch=$branch"
            echo "base_sha=$base_sha"
            echo "release_sha=$release_sha"
          } >> "$GITHUB_OUTPUT"

  test:
    name: Merge the release and run the test suite
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: ubuntu-latest
    # A PAT is needed to push upstream workflow file changes and to trigger CI.
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
      TAG: ${{ needs.check.outputs.tag }}
      BRANCH: ${{ needs.check.outputs.branch }}
      BASE_SHA: ${{ needs.check.outputs.base_sha }}
      RELEASE_SHA: ${{ needs.check.outputs.release_sha }}
    outputs:
      conflict: ${{ steps.merge.outputs.conflict }}
      branch_sha: ${{ steps.merge.outputs.branch_sha }}
      passed: ${{ steps.tests.outputs.passed }}
      url: ${{ steps.tests.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - name: Merge the release into a test branch
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/$UPSTREAM_REPO.git"
          git fetch --no-tags upstream "refs/tags/$TAG:refs/upstream-tags/$TAG"
          git fetch --no-tags origin "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"

          if [[ "$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH")" != "$BASE_SHA" ]]; then
            echo "::error::$TARGET_BRANCH changed after release detection; retry on the next schedule."
            exit 1
          fi
          if [[ "$(git rev-parse "refs/upstream-tags/$TAG^{commit}")" != "$RELEASE_SHA" ]]; then
            echo "::error::The upstream tag $TAG changed after release detection."
            exit 1
          fi

          git checkout -b "$BRANCH" "$BASE_SHA"
          if git merge --no-ff -m "Sync upstream $TAG" "$RELEASE_SHA"; then
            conflict=false
          else
            # Push the conflict markers so Copilot can resolve them on this branch.
            git add -A
            git commit -qm "Sync upstream $TAG (conflicts to resolve)"
            conflict=true
          fi
          git push --force origin "$BRANCH"
          echo "conflict=$conflict" >> "$GITHUB_OUTPUT"
          echo "branch_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run the test suite on the merge
        id: tests
        if: steps.merge.outputs.conflict == 'false'
        run: |
          list_runs() {
            gh run list --workflow ci.yml --branch "$BRANCH" --event workflow_dispatch \
              --limit 100 --json databaseId --jq '.[].databaseId' | sort
          }
          before=$(list_runs)
          gh workflow run ci.yml --ref "$BRANCH"

          # The new run is the one whose id was not listed before the dispatch.
          run_id=
          for _ in $(seq 1 30); do
            sleep 4
            run_id=$(comm -13 <(printf '%s\n' "$before") <(list_runs) | sort -n | tail -n 1)
            [[ -n "$run_id" ]] && break
          done
          if [[ -z "$run_id" ]]; then
            echo "::error::Could not identify the CI run started on $BRANCH."
            exit 1
          fi

          echo "url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id" >> "$GITHUB_OUTPUT"
          if gh run watch "$run_id" --exit-status; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

  sync:
    name: Merge a passing stable release
    needs: [check, test]
    if: needs.check.outputs.kind == 'stable' && needs.test.outputs.passed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
      TAG: ${{ needs.check.outputs.tag }}
      BRANCH: ${{ needs.check.outputs.branch }}
      BASE_SHA: ${{ needs.check.outputs.base_sha }}
      RELEASE_SHA: ${{ needs.check.outputs.release_sha }}
      BRANCH_SHA: ${{ needs.test.outputs.branch_sha }}
      RUN_URL: ${{ needs.test.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - name: Recheck the tested revisions
        run: |
          git remote add upstream "https://github.com/$UPSTREAM_REPO.git"
          git fetch --no-tags upstream "refs/tags/$TAG:refs/upstream-tags/$TAG"
          git fetch --no-tags origin \
            "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH" \
            "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"

          if [[ "$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH")" != "$BASE_SHA" ]]; then
            echo "::error::$TARGET_BRANCH changed after the tests started; retry on the next schedule."
            exit 1
          fi
          if [[ "$(git rev-parse "refs/upstream-tags/$TAG^{commit}")" != "$RELEASE_SHA" ]]; then
            echo "::error::The upstream tag $TAG changed after the tests started."
            exit 1
          fi
          if [[ "$(git rev-parse "refs/remotes/origin/$BRANCH")" != "$BRANCH_SHA" ]]; then
            echo "::error::$BRANCH changed after it was tested."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/$TAG:refs/origin-tags/$TAG"
            if [[ "$(git rev-parse "refs/origin-tags/$TAG^{commit}")" != "$RELEASE_SHA" ]]; then
              echo "::error::Fork tag $TAG exists but points to a different commit than upstream."
              exit 1
            fi
          fi

      - name: Open and merge the pull request
        run: |
          gh pr create --base "$TARGET_BRANCH" --head "$BRANCH" \
            --title "Sync upstream $TAG" \
            --body "Merge of upstream release [$TAG](https://github.com/$UPSTREAM_REPO/releases/tag/$TAG). Tests passed: $RUN_URL"
          gh pr merge "$BRANCH" --merge --delete-branch --match-head-commit "$BRANCH_SHA"

  report:
    name: Report problems and record the release
    needs: [check, test, sync]
    if: >-
      always() && needs.check.outputs.needed == 'true' && needs.test.result == 'success' &&
      (needs.sync.result == 'success' || needs.sync.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
      TAG: ${{ needs.check.outputs.tag }}
      KIND: ${{ needs.check.outputs.kind }}
      BRANCH: ${{ needs.check.outputs.branch }}
      CONFLICT: ${{ needs.test.outputs.conflict }}
      PASSED: ${{ needs.test.outputs.passed }}
      RUN_URL: ${{ needs.test.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - name: Open an issue for a conflict or failing tests
        if: needs.test.outputs.conflict == 'true' || needs.test.outputs.passed == 'false'
        run: |
          if [[ "$CONFLICT" = "true" ]]; then
            reason="Merging it into \`$TARGET_BRANCH\` produces **conflicts**."
          else
            reason="The test suite fails on \`$TARGET_BRANCH\` merged with it: $RUN_URL"
          fi
          if [[ "$KIND" = prerelease ]]; then
            title="Upstream prerelease $TAG breaks the fork"
            todo="The next stable release will likely need the same fix. Merge \`upstream-$TAG\` into a branch from \`$TARGET_BRANCH\`, fix it, and open a PR to \`$TARGET_BRANCH\`."
          else
            title="Upstream release $TAG cannot be merged"
            todo="Fix it on the branch \`$BRANCH\` (already pushed), then open a PR to \`$TARGET_BRANCH\`."
          fi
          body="Upstream [$TAG](https://github.com/$UPSTREAM_REPO/releases/tag/$TAG) is not compatible with the fork. $reason $todo"

          existing=$(gh issue list --state all --search "\"$title\" in:title" --limit 100 --json title \
            | jq --arg t "$title" '[.[] | select(.title == $t)] | length')
          if [[ "$existing" != "0" ]]; then
            echo "An issue titled \"$title\" already exists."
            exit 0
          fi
          # Assigning Copilot lets it propose a fix as a PR; the issue is still created if that fails.
          gh issue create --title "$title" --body "$body" --assignee copilot \
            || gh issue create --title "$title" --body "$body"

      - name: Record the release as handled
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          git tag "upstream-synced/$TAG" "origin/$TARGET_BRANCH"
          git push origin "upstream-synced/$TAG"
          # Failed stable syncs keep their branch for the fix.
          if [[ "$KIND" = prerelease ]]; then
            git push origin --delete "$BRANCH" || true
          fi
